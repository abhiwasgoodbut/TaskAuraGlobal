<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D GLB Model Viewer - TaskAura</title>
  <!-- Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121217;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 14px 24px;
      background: #1a1a22;
      border-bottom: 1px solid #2a2a35;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 16px; font-weight: 700; color: #fff; }
    .btn-group { display: flex; gap: 10px; }
    button {
      background: #2b2d3c;
      color: #fff;
      border: 1px solid #3d4058;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    button.active {
      background: #d4af37;
      color: #121217;
      border-color: #f3e5ab;
      font-weight: 700;
    }
    button:hover:not(.active) {
      background: #3a3d52;
    }
    main {
      flex: 1;
      position: relative;
      display: flex;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #242433 0%, #0f0f14 100%);
    }
    .info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(18, 18, 23, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 14px 18px;
      border-radius: 8px;
      max-width: 440px;
      font-size: 12.5px;
      line-height: 1.5;
      color: #b0b0c0;
    }
    .info-panel strong { color: #fff; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>ICG Gallery 3D GLB Inspector</h1>
    </div>
    <div class="btn-group">
      <button id="btn-room" class="active" onclick="loadModel('uf_pov.glb', this, 'Underground Floor 3D Geometry (uf_pov.glb)')">
        🏠 3D Room Geometry (uf_pov.glb)
      </button>
      <button id="btn-camera" onclick="loadModel('camera_paths.glb', this, 'Camera Rig & Animation Paths (camera_paths.glb)')">
        🎥 Camera Paths & Rigs (camera_paths.glb)
      </button>
    </div>
  </header>

  <main>
    <model-viewer
      id="viewer"
      src="uf_pov.glb"
      alt="3D GLB Model"
      auto-rotate
      camera-controls
      autoplay
      ar
      shadow-intensity="1"
      exposure="1.2">
    </model-viewer>

    <div class="info-panel" id="info-box">
      <strong>Model:</strong> Underground Floor 3D Geometry (uf_pov.glb)<br>
      <span style="color:#d4af37;">Controls:</span> Left-click & drag to rotate • Right-click & drag to pan • Scroll to zoom.
    </div>
  </main>

  <script>
    function loadModel(fileName, btn, label) {
      document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const viewer = document.getElementById('viewer');
      viewer.src = fileName;
      
      const info = document.getElementById('info-box');
      if (fileName === 'camera_paths.glb') {
        info.innerHTML = `<strong>Model:</strong> Camera Rig & Animations (camera_paths.glb)<br>` +
          `Notice: This file contains <strong>cameras & animation tracks</strong> (no solid meshes). To see the animation play, rotate or check online viewers like Babylon.js or Blender.`;
      } else {
        info.innerHTML = `<strong>Model:</strong> ${label}<br>` +
          `<span style="color:#d4af37;">Controls:</span> Left-click & drag to rotate • Right-click & drag to pan • Scroll to zoom.`;
      }
    }
  </script>

</body>
</html>
