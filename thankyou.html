<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

    gtag('js', new Date());

    gtag('config', 'G-PPX3X2PD6S');
    gtag('config', 'AW-18354107634');

  <!-- Event snippet for Submit lead form conversion page -->
  <script>
    gtag('event', 'conversion', {
        'send_to': 'AW-18354107634/lmDtCNW08tccEPLp9a9E',
        'value': 1.0,
        'currency': 'INR'
    });
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thank you for contacting TaskAura Global. Your consultation request has been received." />
  <meta http-equiv="refresh" content="6;url=index.html">
  <title>Thank You — TaskAura Global</title>
  <link rel="icon" type="image/png" href="asset/logo/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #05050a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    .glowing-bg {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212, 168, 83, 0.04) 0%, rgba(0, 0, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }
    .thankyou-card {
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(212, 168, 83, 0.15);
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 2;
      animation: zoomIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .thankyou-logo {
      margin-bottom: 28px;
    }
    .thankyou-logo img {
      height: 40px;
      width: auto;
    }
    .success-icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(212, 168, 83, 0.08);
      border: 2px solid rgba(212, 168, 83, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-gold);
      margin: 0 auto 28px auto;
      box-shadow: 0 0 25px rgba(212, 168, 83, 0.15);
      position: relative;
    }
    .success-icon-wrapper svg {
      width: 32px;
      height: 32px;
    }
    .thankyou-card h1 {
      font-family: 'Outfit', sans-serif;
      color: var(--color-white);
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .thankyou-card p {
      color: var(--color-gray-text-light);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .redirect-status {
      font-size: 0.88rem;
      color: var(--color-gray-text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--color-gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Glow Background -->
  <div class="glowing-bg"></div>

  <!-- Thank You Container -->
  <div class="thankyou-card">
    <!-- Brand Logo -->
    <div class="thankyou-logo">
      <img src="https://i0.wp.com/taskauraglobal.com/wp-content/uploads/2025/11/taskaura_new_logo-removebg-preview-1-e1764436845776.png?w=352&ssl=1" alt="TaskAura Logo" />
    </div>

    <!-- Success Checkmark -->
    <div class="success-icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <!-- Content -->
    <h1>Thank You!</h1>
    <p>Your consultation request has been successfully submitted. We will review your practice details and reach out shortly.</p>

    <!-- CTA Hook Button -->
    <div style="margin: 28px 0 32px 0;">
      <a href="index.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background: var(--gradient-gold); color: var(--color-dark); padding: 14px 32px; border-radius: 100px; font-weight: 700; font-size: 0.95rem; box-shadow: 0 8px 24px rgba(212, 168, 83, 0.25); transition: all 0.3s ease;">
        Return to Home Page Now
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>

    <!-- Redirect counter -->
    <div class="redirect-status">
      <div class="spinner"></div>
      <span>Redirecting you to our home page in <strong id="countdown" style="color: var(--color-gold);">6</strong> seconds...</span>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      let timeLeft = 6;
      const countdownEl = document.getElementById("countdown");
      
      const timer = setInterval(() => {
        timeLeft--;
        if (countdownEl) {
          countdownEl.textContent = timeLeft;
        }
        if (timeLeft <= 0) {
          clearInterval(timer);
          window.location.href = "index.html";
        }
      }, 1000);
    });
  </script>
</body>
</html>
